# Sends progress/report.json to decompilati.onl on every push to main.
#
# The report is generated locally with `py tools/progress.py <your iso>` (it needs the
# disc, which never goes into this repository) and committed with the change it measures.
#
# Setup: add the project's API key as a repository secret named DECOMP_API_KEY
# (Settings > Secrets and variables > Actions). Without it, the step is skipped.
name: Progress report

on:
  push:
    branches: [main]
    paths: [progress/report.json]
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate report
        run: python3 -c "import json; json.load(open('progress/report.json'))"

      - name: Send progress to decompilati.onl
        if: env.DECOMP_API_KEY != ''
        env:
          DECOMP_API_KEY: ${{ secrets.DECOMP_API_KEY }}
          BASE: https://decompilati.onl
        run: |
          MSG=$(git log -1 --pretty=%s | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip()))")
          curl --fail -sS -X POST "$BASE/api/v1/progress?commit=$GITHUB_SHA&message=$MSG" \
            -H "Authorization: Bearer $DECOMP_API_KEY" \
            -H "Content-Type: application/json" \
            --data @progress/report.json

      # GitHub shows README images through its own cache (camo), which may keep a badge for days.
      # Ask it to drop the cached badges so the README shows the new numbers.
      - name: Refresh the README badges
        continue-on-error: true
        run: |
          sleep 20
          curl -s "https://github.com/$GITHUB_REPOSITORY" \
            | grep -o 'https://camo.githubusercontent.com/[0-9a-f]*/[0-9a-f]*' | sort -u \
            | while read -r url; do curl -s -m 30 -X PURGE "$url"; echo; done
